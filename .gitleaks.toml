# The local-development seed login in examples/seed_dev.py is a documented test value.
# tests/fixtures/pii.jsonl and tests/test_redaction_modes.py hold fake keys (AWS's documented example key and placeholders) for the redaction tests.
[extend]
useDefault = true

[allowlist]
description = "documented development-only test credentials and fake keys in redaction fixtures"
paths = ['''examples/seed_dev\.py''', '''tests/fixtures/pii\.jsonl''', '''tests/test_redaction_modes\.py''']
