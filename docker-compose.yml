# Self-hosted Tirkit: `docker compose up -d`, then open http://localhost:8000 and create the admin.
# Pulls the published image: no clone and no build. Pin a release with TIRKIT_IMAGE (for example
# TIRKIT_IMAGE=ghcr.io/stmarkadebayo/tirkit:v0.1.0 in a .env file next to this one).
# Change POSTGRES_PASSWORD there too before exposing the server.
# To build the image from a checkout of the repository instead, add the override file:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tirkit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tirkit}
      POSTGRES_DB: tirkit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tirkit"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  tirkit:
    image: ${TIRKIT_IMAGE:-ghcr.io/stmarkadebayo/tirkit:latest}
    environment:
      TIRKIT_DATABASE_URL: postgresql://tirkit:${POSTGRES_PASSWORD:-tirkit}@db:5432/tirkit
      # Plain-HTTP local use. Remove when serving over HTTPS behind a proxy.
      TIRKIT_INSECURE_COOKIES: ${TIRKIT_INSECURE_COOKIES:-1}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      TIRKIT_EMBEDDED_WORKER: "0"
      # See docs/site/security.md. Behind one reverse proxy set TIRKIT_TRUSTED_PROXIES=1.
      TIRKIT_TRUSTED_PROXIES: ${TIRKIT_TRUSTED_PROXIES:-0}
      TIRKIT_CORS_ORIGINS: ${TIRKIT_CORS_ORIGINS:-}
      TIRKIT_ALLOW_PRIVATE_WEBHOOKS: ${TIRKIT_ALLOW_PRIVATE_WEBHOOKS:-}
    ports:
      - "${TIRKIT_PORT:-8000}:8000"
    volumes:
      - media:/data/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ${TIRKIT_IMAGE:-ghcr.io/stmarkadebayo/tirkit:latest}
    command: ["tirkit", "worker"]
    environment:
      TIRKIT_DATABASE_URL: postgresql://tirkit:${POSTGRES_PASSWORD:-tirkit}@db:5432/tirkit
      TIRKIT_MEDIA_DIR: /data/media
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JUDGE_MODEL: ${JUDGE_MODEL:-}
      TIRKIT_ALLOW_PRIVATE_WEBHOOKS: ${TIRKIT_ALLOW_PRIVATE_WEBHOOKS:-}  # alerts are sent from here
    volumes:
      - media:/data/media
    depends_on:
      tirkit:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  media:
