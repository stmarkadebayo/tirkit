[project]
name = "tirkit"
version = "0.1.0"
description = "LLM eval and observability platform: tracing, test sets mined from production logs, CI regression gates, and an LLM judge you can actually trust."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "St. Mark Adebayo" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring",
]
# Unpinned on purpose: pin after your first install (uv lock or pip freeze).
dependencies = [
    "typer",
    "httpx",
]

[project.urls]
Repository = "https://github.com/stmarkadebayo/tirkit"
Issues = "https://github.com/stmarkadebayo/tirkit/issues"
Changelog = "https://github.com/stmarkadebayo/tirkit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "argon2-cffi>=23",
    "opentelemetry-proto>=1.27",
    "prometheus-client>=0.20",
]
# Optional OTLP/gRPC receiver (tirkit serve --otlp-grpc-port 4317).
otlp-grpc = ["tirkit[server]", "grpcio>=1.60"]
docs = ["mkdocs-material>=9.5"]
dev = [
    "tirkit[server]",
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "import-linter>=2.1",
    "jsonschema>=4.18",
    # Provider SDKs, only to test instrumentation against the real clients.
    "openai>=2",
    "anthropic>=1",
    "google-genai>=1",
    # Integration tests: LangChain handler, transformers pipelines (faked), OTel SDK example.
    "langchain-core>=0.3",
    "numpy>=1.26",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    # OTLP parity tests: gRPC receiver and exporter, and the common GenAI instrumentations.
    "tirkit[otlp-grpc]",
    "opentelemetry-exporter-otlp-proto-grpc>=1.27",
    "openinference-instrumentation-openai>=0.1.30",
    "opentelemetry-instrumentation-openai>=0.40",
    "opentelemetry-instrumentation-openai-v2>=2.0b0,<2.4",
    # Adapter and integration tests (fake or mocked transports; CrewAI is too large and is run
    # separately, see docs/DECISIONS.md).
    "boto3>=1.34",
    "mistralai>=1.0",
    "cohere>=5.13",
    "litellm>=1.50",
    "openai-agents>=0.2",
    "llama-index-core>=0.12",
    "dspy>=2.6",
    "wrapt<3",  # the OpenTelemetry OpenAI instrumentation breaks on wrapt 2
]


[project.scripts]
tirkit = "tirkit.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tirkit"]
# The built web UI is copied here by `make dist` (git-ignored) so `pip install tirkit[server]`
# followed by `tirkit serve` shows the UI.
artifacts = ["src/tirkit/server/web"]

[tool.ruff]
cache-dir = ".cache/ruff"
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "typer.Option",
    "typer.Argument",
    "fastapi.Depends",
    "fastapi.Body",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures and benchmark payloads are clearer as long literal lines.
"tests/*" = ["E501"]
"research/*" = ["E501"]
"examples/*" = ["E501"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "acceptance: definition-of-done tests from docs/SPEC.md; they fail until the feature is built",
    "postgres: needs TIRKIT_TEST_POSTGRES_URL (a scratch Postgres database)",
    "server: needs the server extra (FastAPI); see make test-server",
]

[tool.mypy]
cache_dir = ".cache/mypy"
python_version = "3.11"
ignore_missing_imports = true
