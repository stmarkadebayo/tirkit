# Python: lint, layer contracts, API schema drift, tests. Runs only when Python code or the API
# contract can have changed; the web UI and docs have their own workflows.
name: python
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "research/**"
      - "docs/api/**"
      - "pyproject.toml"
      - ".importlinter"
      - "Makefile"
      - "scripts/install_smoke.py"
      - "scripts/docker_smoke.py"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "research/**"
      - "docs/api/**"
      - "pyproject.toml"
      - ".importlinter"
      - "Makefile"
      - "scripts/install_smoke.py"
      - "scripts/docker_smoke.py"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - name: Layer contracts (import-linter)
        run: lint-imports
      - name: OpenAPI schema is current
        run: |
          python -m tirkit.server.openapi > docs/api/openapi.json
          git diff --exit-code -- docs/api/openapi.json || {
            echo "::error::docs/api/openapi.json is stale. Run 'make api' and commit the result."
            exit 1
          }

  core:
    # Tests that do not need the server extra.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q -m "not server and not acceptance"

  server:
    # Pinned: the Postgres 16 client tools below are not in the newer default image.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tirkit
          POSTGRES_PASSWORD: tirkit
          POSTGRES_DB: tirkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tirkit" --health-interval 5s --health-retries 20
    env:
      TIRKIT_TEST_POSTGRES_URL: postgresql://tirkit:tirkit@localhost:5432/tirkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Postgres 16 client tools (pg_dump must match the server's major version)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Node OpenTelemetry exporter for the OTLP parity test
        run: npm ci --no-audit --no-fund --prefix tests/otel_node
      - name: Server, API contract and Postgres tests
        run: pytest -q -m "(server or postgres) and not acceptance"
      - name: Acceptance tests (progress meter)
        run: pytest -q -m acceptance
  package:
    # The wheel must carry the web UI, or `pip install tirkit[server]` then `tirkit serve` has no UI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      - run: cp -R web/dist src/tirkit/server/web
      - run: pip wheel . --no-deps -w dist
      - run: python scripts/check_wheel.py dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
          retention-days: 7
  install:
    # What a new user does: pip install the wheel into a clean environment (no Docker), trace
    # with no server, then `tirkit serve` on the same file. Across the supported Pythons and OSes.
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, python: "3.11" }
          - { os: ubuntu-24.04, python: "3.12" }
          - { os: ubuntu-24.04, python: "3.13" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel
          path: dist
      - run: python -m pip install httpx
      - name: Install the wheel and use it
        shell: bash
        run: python scripts/install_smoke.py dist/*.whl
