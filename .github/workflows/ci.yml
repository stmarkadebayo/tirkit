name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tirkit
          POSTGRES_PASSWORD: tirkit
          POSTGRES_DB: tirkit
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tirkit" --health-interval 5s --health-retries 20
    env:
      TIRKIT_TEST_POSTGRES_URL: postgresql://tirkit:tirkit@localhost:5432/tirkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - name: Unit, server and Postgres tests
        run: pytest -q -m "not acceptance"
      - name: Acceptance tests (progress meter)
        run: pytest -q -m acceptance

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  secrets:
    # Fails the build if a key, token or password is committed anywhere in history.
    # Free for personal accounts; an organisation-owned repo needs a GITLEAKS_LICENSE secret.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
