# Release: build the wheel (with the web UI), check it, then publish to PyPI, npm and GHCR.
# Runs when a tag like v0.1.0 is pushed, or by hand (a manual run builds and checks only).
# One-time setup for the accounts and secrets is in docs/RELEASING.md.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "::error::tag ${GITHUB_REF_NAME} does not match version $version"; exit 1; }
      - run: cd web && npm ci --no-audit --no-fund && npm run build
      - run: cp -R web/dist src/tirkit/server/web
      - run: pip install build twine
      - run: python -m build --wheel   # from the tree, not from the sdist, so the UI is included
      - run: python -m build --sdist
      - run: python scripts/check_wheel.py dist/*.whl
      - run: twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  publish-pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token is stored
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
  publish-npm:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write  # provenance
    defaults:
      run:
        working-directory: sdk-ts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  publish-image:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
  verify-image:
    # Pull the image just published, the way a user's `docker compose up` does, and smoke test it.
    needs: publish-image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TIRKIT_IMAGE: ghcr.io/${{ github.repository }}:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .   # the SDK and httpx, for the smoke script
      - name: docker compose up (pulls the published image)
        run: docker compose up -d --pull always
      - name: Smoke test
        run: python scripts/docker_smoke.py --url http://localhost:8000
      - name: Logs (on failure)
        if: failure()
        run: docker compose logs --no-color --tail 200

