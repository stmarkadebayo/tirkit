# Fails the build if a key, token or password is committed anywhere in history.
# Free for personal accounts; an organisation-owned repo needs a GITLEAKS_LICENSE secret.
name: secrets
on: [push, pull_request]
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
