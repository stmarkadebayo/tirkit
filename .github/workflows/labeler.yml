# Labels each pull request with the areas it touches (see .github/labeler.yml).
# pull_request_target is safe here: the action reads the list of changed files and never checks
# out or runs pull-request code.
name: labeler
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
