# Asks every outside contributor to sign .github/CLA.md once, by commenting on their pull request.
# Signatures are stored in signatures/version1/cla.json on the unprotected `cla-signatures` branch.
# This workflow never checks out pull-request code, which keeps pull_request_target safe here.
name: CLA
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA' ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/.github/CLA.md
          branch: cla-signatures
          allowlist: stmarkadebayo,dependabot[bot],github-actions[bot],bot*
