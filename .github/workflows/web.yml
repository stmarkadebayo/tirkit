# Web UI: the generated API types match docs/api/openapi.json, the code typechecks, and it builds.
name: web
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "docs/api/openapi.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "docs/api/openapi.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Generated API types are current
        run: |
          npm run -s api
          git diff --exit-code -- src/api/schema.ts || {
            echo "::error::web/src/api/schema.ts is stale. Run 'make api' and commit the result."
            exit 1
          }
      - run: npm test
      - run: npm run build
