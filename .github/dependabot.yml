# Weekly update pull requests for every ecosystem the repository uses, so vulnerable or stale
# dependencies are proposed (and tested by CI) without anyone remembering to look.
# Updates are grouped into one pull request per ecosystem, and major version bumps are skipped:
# they usually need code changes, so they are done by hand. pip-audit and npm audit in CI still
# flag known vulnerabilities whatever the version.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      python:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      web:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /sdk-ts
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      sdk-ts:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
