# Weekly update pull requests for every ecosystem the repository uses, so vulnerable or stale
# dependencies are proposed (and tested by CI) without anyone remembering to look.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: npm
    directory: /sdk-ts
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    labels: [dependencies]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
