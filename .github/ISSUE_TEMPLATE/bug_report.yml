name: Bug report
description: Something in Tirkit doesn't work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security vulnerabilities, do not use this form; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest code, command or config that shows the problem. Remove any secrets.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tirkit version
      placeholder: e.g. 0.1.0 or a commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Python SDK, TypeScript SDK, Server / API, Web UI, CLI, Worker / online evals, Deployment, Docs]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, Python or Node version, how you deployed (docker compose, tirkit serve, other).
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove any prompts, user data or keys.
      render: text
