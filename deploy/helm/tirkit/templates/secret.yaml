{{- if not .Values.secrets.existingSecret }}
{{- $pw := include "tirkit.postgresPassword" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tirkit.fullname" . }}
  labels:
    {{- include "tirkit.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ $pw | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username ($pw | urlquery) (include "tirkit.fullname" .) .Values.postgresql.auth.database | quote }}
  {{- else }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required when postgresql.enabled is false" .Values.secrets.databaseUrl | quote }}
  {{- end }}
  {{- with .Values.secrets.adminPassword }}
  ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.llmApiKey }}
  LLM_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anthropicApiKey }}
  ANTHROPIC_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.metrics.token }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
